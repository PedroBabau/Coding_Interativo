<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Storm — Projeto 01</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: rgba(255,255,255,0.08);
      --accent: #c8f500;
      --text: #f0eee8;
      --muted: #6b6a72;
      --font-mono: 'Space Mono', monospace;
      --font-head: 'Syne', sans-serif;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-mono);
      color: var(--text);
    }

    #p5-canvas-container {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* TOP BAR */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1.25rem;
      background: rgba(10,10,15,0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-title {
      font-family: var(--font-head);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .topbar-title span { color: var(--accent); }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      transition: all 0.2s;
    }
    .back-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* GUI PANEL */
    .gui {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 200px;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-right: none;
      padding: 1rem;
      transition: transform 0.3s ease;
    }

    .gui.hidden { transform: translateY(-50%) translateX(200px); }

    .gui-toggle {
      position: absolute;
      left: -36px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 48px;
      background: rgba(10,10,15,0.9);
      border: 1px solid var(--border);
      border-right: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--muted);
      transition: color 0.2s;
    }
    .gui-toggle:hover { color: var(--accent); }

    .gui-title {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .ctrl {
      margin-bottom: 0.9rem;
    }

    .ctrl-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.6rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
      letter-spacing: 0.05em;
    }
    .ctrl-label span { color: var(--text); }

    input[type=range] {
      width: 100%;
      height: 3px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }
    input[type=range]:focus { outline: none; }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }

    .gui-btn {
      font-family: var(--font-mono);
      font-size: 0.55rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.4rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .gui-btn:hover { color: var(--accent); border-color: var(--accent); }
    .gui-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

    select {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.35rem 0.5rem;
      outline: none;
      cursor: pointer;
      appearance: none;
    }

    /* HINTS */
    .hints {
      position: fixed;
      bottom: 1rem;
      left: 1rem;
      z-index: 10;
      font-size: 0.6rem;
      color: var(--muted);
      line-height: 1.8;
      letter-spacing: 0.05em;
    }
    .hints .key {
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 0.1rem 0.3rem;
      font-size: 0.55rem;
      margin-right: 0.25rem;
      color: rgba(255,255,255,0.4);
    }

    /* STATS */
    .stats {
      position: fixed;
      bottom: 1rem;
      right: 220px;
      z-index: 10;
      font-size: 0.6rem;
      color: var(--muted);
      text-align: right;
      letter-spacing: 0.05em;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      .gui { width: 170px; top: auto; bottom: 0; right: 0; transform: none; border-right: 1px solid var(--border); border-bottom: none; }
      .gui.hidden { transform: translateY(200px); }
      .gui-toggle { left: -36px; top: auto; bottom: 100%; transform: none; top: -36px; left: 50%; transform: translateX(-50%) rotate(90deg); }
      .stats { right: 1rem; bottom: 4rem; }
      .hints { display: none; }
    }
  </style>
</head>
<body>

<div id="p5-canvas-container"></div>

<div class="topbar">
  <div class="topbar-title">Particle<span>Storm</span></div>
  <a href="../index.html" class="back-btn">← voltar</a>
</div>

<div class="gui" id="gui">
  <button class="gui-toggle" id="gui-toggle" title="Mostrar/esconder controlos">⊞</button>
  <div class="gui-title">Controlos</div>

  <div class="ctrl">
    <div class="ctrl-label">Partículas <span id="val-count">150</span></div>
    <input type="range" id="sl-count" min="20" max="400" value="150">
  </div>

  <div class="ctrl">
    <div class="ctrl-label">Velocidade <span id="val-speed">1.5</span></div>
    <input type="range" id="sl-speed" min="0.2" max="5" step="0.1" value="1.5">
  </div>

  <div class="ctrl">
    <div class="ctrl-label">Tamanho <span id="val-size">3</span></div>
    <input type="range" id="sl-size" min="1" max="10" step="0.5" value="3">
  </div>

  <div class="ctrl">
    <div class="ctrl-label">Ligações <span id="val-conn">120</span></div>
    <input type="range" id="sl-conn" min="0" max="300" value="120">
  </div>

  <div class="ctrl">
    <div class="ctrl-label">Cor</div>
    <select id="sel-color">
      <option value="green">Verde néon</option>
      <option value="pink">Rosa néon</option>
      <option value="cyan">Ciano</option>
      <option value="rainbow">Arco-íris</option>
      <option value="fire">Fogo</option>
    </select>
  </div>

  <div class="btn-grid">
    <button class="gui-btn active" id="btn-attract">Atrair</button>
    <button class="gui-btn" id="btn-repel">Repelir</button>
    <button class="gui-btn active" id="btn-trail">Rastro</button>
    <button class="gui-btn" id="btn-burst">Burst</button>
  </div>
</div>

<div class="hints">
  <div><span class="key">Mouse</span> Atrair/repelir partículas</div>
  <div><span class="key">C</span> Limpar tela</div>
  <div><span class="key">Space</span> Explodir todas</div>
  <div><span class="key">R</span> Resetar</div>
  <div><span class="key">+/-</span> Mais/menos partículas</div>
</div>

<div class="stats">
  <div id="stat-fps">FPS: --</div>
  <div id="stat-parts">Partículas: --</div>
</div>
  <script>
      // p5.js sketch
    const sketch = (p) => {
      let particles = [];
      let cfg = {
        count: 150,
        speed: 1.5,
        size: 3,
        connDist: 120,
        colorMode: 'green',
        attract: true,
        trail: true,
        burst: false
      };

      const colorPalettes = {
        green:   (h) => p.color(70 + h*10, 100, 60, 85),
        pink:    (h) => p.color(300 + h*10, 90, 65, 85),
        cyan:    (h) => p.color(185 + h*10, 90, 65, 85),
        rainbow: (h) => p.color(h * 360, 85, 65, 85),
        fire:    (h) => p.color(h * 40, 95, 65, 85)
      };

      function getColor(pct) {
        p.colorMode(p.HSB, 360, 100, 100, 100);
        const fn = colorPalettes[cfg.colorMode] || colorPalettes.green;
        return fn(pct);
      }

      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.pos = p.createVector(p.random(p.width), p.random(p.height));
          this.vel = p5.Vector.random2D().mult(p.random(0.5, cfg.speed));
          this.acc = p.createVector(0, 0);
          this.id = p.random();
          this.life = p.random(0.4, 1.0);
        }
        applyForce(f) { this.acc.add(f); }
        update() {
          this.vel.add(this.acc);
          this.vel.limit(cfg.speed * 2.5);
          this.pos.add(this.vel);
          this.acc.mult(0);
          // wrap
          if (this.pos.x < 0) this.pos.x = p.width;
          if (this.pos.x > p.width) this.pos.x = 0;
          if (this.pos.y < 0) this.pos.y = p.height;
          if (this.pos.y > p.height) this.pos.y = 0;
        }
        draw() {
          p.colorMode(p.HSB, 360, 100, 100, 100);
          const c = getColor(this.id);
          p.noStroke();
          p.fill(c);
          const s = cfg.size * this.life;
          p.circle(this.pos.x, this.pos.y, s);
          // glow
          p.fill(p.hue(c), p.saturation(c), p.brightness(c), 20);
          p.circle(this.pos.x, this.pos.y, s * 3);
        }
        burst(cx, cy) {
          const d = p5.Vector.dist(this.pos, p.createVector(cx, cy));
          if (d < 200) {
            const f = p5.Vector.sub(this.pos, p.createVector(cx, cy));
            f.normalize().mult((200 - d) * 0.15);
            this.applyForce(f);
          }
        }
      }

      function syncCount() {
        while (particles.length < cfg.count) particles.push(new Particle());
        while (particles.length > cfg.count) particles.pop();
      }

      p.setup = () => {
        const cnv = p.createCanvas(p.windowWidth, p.windowHeight);
        cnv.parent('p5-canvas-container');
        p.colorMode(p.HSB, 360, 100, 100, 100);
        syncCount();
      };

      p.draw = () => {
        p.colorMode(p.RGB);
        if (cfg.trail) {
          p.fill(10, 10, 15, 30);
          p.noStroke();
          p.rect(0, 0, p.width, p.height);
        } else {
          p.background(10, 10, 15);
        }

        const mx = p.mouseX, my = p.mouseY;
        const mouseDown = p.mouseIsPressed;

        particles.forEach(pt => {
          if (mouseDown && cfg.attract) {
            const d = p.dist(pt.pos.x, pt.pos.y, mx, my);
            if (d < 250) {
              const f = p5.Vector.sub(p.createVector(mx, my), pt.pos);
              f.normalize().mult(0.6 * (250-d)/250);
              pt.applyForce(f);
            }
          }
          pt.update();
          pt.draw();
        });

        // Draw connections
        p.colorMode(p.HSB, 360, 100, 100, 100);
        for (let i = 0; i < particles.length; i++) {
          for (let j = i+1; j < particles.length; j++) {
            const d = p5.Vector.dist(particles[i].pos, particles[j].pos);
            if (d < cfg.connDist) {
              const alpha = p.map(d, 0, cfg.connDist, 40, 0);
              const c = getColor(particles[i].id);
              p.stroke(p.hue(c), p.saturation(c), p.brightness(c), alpha);
              p.strokeWeight(0.5);
              p.line(particles[i].pos.x, particles[i].pos.y, particles[j].pos.x, particles[j].pos.y);
            }
          }
        }

        // Update stats
        if (p.frameCount % 15 === 0) {
          document.getElementById('stat-fps').textContent = 'FPS: ' + Math.round(p.frameRate());
          document.getElementById('stat-parts').textContent = 'Partículas: ' + particles.length;
        }
      };

      p.mousePressed = () => {
        if (cfg.burst) {
          particles.forEach(pt => pt.burst(p.mouseX, p.mouseY));
        }
      };

      p.keyPressed = () => {
        if (p.key === 'c' || p.key === 'C') {
          p.background(10, 10, 15);
        }
        if (p.key === ' ') {
          const cx = p.width/2, cy = p.height/2;
          particles.forEach(pt => {
            const f = p5.Vector.sub(pt.pos, p.createVector(cx, cy));
            f.normalize().mult(p.random(3, 8));
            pt.applyForce(f);
          });
        }
        if (p.key === 'r' || p.key === 'R') {
          particles.forEach(pt => pt.reset());
        }
        if (p.key === '+' || p.key === '=') {
          cfg.count = Math.min(400, cfg.count + 20);
          document.getElementById('sl-count').value = cfg.count;
          document.getElementById('val-count').textContent = cfg.count;
          syncCount();
        }
        if (p.key === '-') {
          cfg.count = Math.max(20, cfg.count - 20);
          document.getElementById('sl-count').value = cfg.count;
          document.getElementById('val-count').textContent = cfg.count;
          syncCount();
        }
      };

      p.windowResized = () => { p.resizeCanvas(p.windowWidth, p.windowHeight); };

      // Expose cfg for GUI
      window._p5cfg = cfg;
      window._p5syncCount = syncCount;
      window._p5particles = particles;
    };

    new p5(sketch);

    // GUI Controls
    document.getElementById('gui-toggle').addEventListener('click', () => {
      document.getElementById('gui').classList.toggle('hidden');
    });

    function bindSlider(id, valId, key, parse) {
      const sl = document.getElementById(id);
      sl.addEventListener('input', () => {
        const v = parse ? parseFloat(sl.value) : parseInt(sl.value);
        document.getElementById(valId).textContent = v;
        window._p5cfg[key] = v;
        if (key === 'count' && window._p5syncCount) window._p5syncCount();
      });
    }
    bindSlider('sl-count', 'val-count', 'count', false);
    bindSlider('sl-speed', 'val-speed', 'speed', true);
    bindSlider('sl-size', 'val-size', 'size', true);
    bindSlider('sl-conn', 'val-conn', 'connDist', false);

    document.getElementById('sel-color').addEventListener('change', e => {
      window._p5cfg.colorMode = e.target.value;
    });

    function bindToggle(btnId, cfgKey) {
      const btn = document.getElementById(btnId);
      btn.addEventListener('click', () => {
        window._p5cfg[cfgKey] = !window._p5cfg[cfgKey];
        btn.classList.toggle('active', window._p5cfg[cfgKey]);
      });
    }
    bindToggle('btn-attract', 'attract');
    bindToggle('btn-trail', 'trail');
    bindToggle('btn-burst', 'burst');
    document.getElementById('btn-repel').addEventListener('click', () => {
      window._p5cfg.attract = false;
      // flip attract
    });
  </script>
</body>
</html>
